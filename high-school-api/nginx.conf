# Reverse proxy for the API. Terminate TLS upstream (e.g. via a managed load
# balancer or certbot-managed cert) — this config is HTTP-only and assumes
# TLS termination happens before traffic reaches this container.

# -----------------------------------------------------------------------------
# X-Forwarded-Proto resolution
#
# Two deployment shapes are possible:
#
#   1. Managed LB terminates TLS → forwards to nginx over plain HTTP.
#      The LB sets X-Forwarded-Proto: https. We forward that value.
#
#   2. nginx terminates TLS itself (certbot sidecar or direct HTTPS).
#      There's no upstream header; we fall back to $scheme.
#
# The map picks whichever is available. Without it, the app sees "http" even
# when the client used HTTPS — which breaks secure-cookie flags, OAuth
# redirect URIs, and absolute URLs in API responses.
# -----------------------------------------------------------------------------
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    # -------------------------------------------------------------------------
    # Upload size policy
    #
    # The application layer enforces two limits:
    #   - JSON bodies: 1 MB (express.json({ limit: '1mb' }))
    #   - File uploads: MAX_UPLOAD_MB, default 10 MB (multer)
    #
    # nginx can't distinguish these by method, only by path. So the global
    # ceiling is set to the JSON limit, and upload endpoints get a larger
    # override. If a new upload endpoint is added, give it its own location
    # block — otherwise nginx returns 413 before the app has a chance to
    # apply its own (smaller) limit.
    # -------------------------------------------------------------------------
    client_max_body_size 1m;

    # -------------------------------------------------------------------------
    # Shared proxy settings
    #
    # Kept in a snippet that's included by every location. Editing one block
    # updates every route.
    # -------------------------------------------------------------------------
    # (nginx doesn't have named snippets; the shared headers are repeated
    #  per location. To avoid duplication, this file could use an `include`
    #  pointing at a real file — see the note at the bottom.)

    # -------------------------------------------------------------------------
    # File uploads
    #
    # Larger ceiling than the default. `MAX_UPLOAD_MB` in .env should be
    # less than or equal to this value; if it's larger, nginx will reject
    # the request before multer sees it.
    # -------------------------------------------------------------------------

    location /api/v1/school/logo {
        client_max_body_size 12m;
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Request-Id $request_id;
        # bcrypt hashing (used in enroll/reset-password) can take ~250ms of
        # CPU; give the app headroom so a slow hash doesn't trip a timeout.
        proxy_read_timeout 30s;
    }

    location ~ ^/api/v1/(students/enroll|teachers|users)$ {
        client_max_body_size 4m;
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 30s;
    }

    # -------------------------------------------------------------------------
    # Auto-translate is deliberately slow — up to 100 sequential HTTP calls
    # to MyMemory with a 200ms delay between each, so a full batch takes
    # ~20 seconds. The default 60s read timeout is enough, but raising it
    # here documents the intent and prevents a future tightening from
    # silently breaking this endpoint.
    # -------------------------------------------------------------------------
    location /api/v1/translations/ {
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 60s;
    }

    # -------------------------------------------------------------------------
    # School logo static assets
    #
    # Served by the API container via express.static at /uploads/logos/*.
    # Public — the logo renders in the site header for every visitor,
    # including anonymous ones on the login page.
    # -------------------------------------------------------------------------
    location /uploads/logos/ {
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Logos are immutable once uploaded (the filename is a UUID), so
        # they can be cached aggressively. One hour matches the
        # express.static maxAge; a browser that has it will keep it.
        proxy_cache_valid 200 1h;
        expires 1h;
        add_header Cache-Control "public, max-age=3600, immutable";
    }

    # -------------------------------------------------------------------------
    # API documentation
    #
    # Swagger enumerates every endpoint and schema. Gated out of production
    # by the app itself (SWAGGER_ENABLED=false); this location just proxies
    # through so the gate is enforced in one place.
    # -------------------------------------------------------------------------
    location /api-docs {
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # -------------------------------------------------------------------------
    # Health check — used by orchestrators and load balancers. No logging,
    # no authentication. Probes shouldn't pollute access logs.
    # -------------------------------------------------------------------------
    location = /health {
        access_log off;
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
    }

    # -------------------------------------------------------------------------
    # Everything else under /api/
    #
    # catch-all for the API. Uses the default 1 MB body limit set at the
    # server level.
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Pass nginx's request ID through. The API's requestId middleware
        # honors an incoming X-Request-Id, so the same ID appears in nginx
        # access logs and API logs — a single correlation key from edge
        # to app.
        proxy_set_header X-Request-Id $request_id;
    }

    # -------------------------------------------------------------------------
    # Default deny — anything not matched above returns 404.
    # -------------------------------------------------------------------------
    location / {
        return 404;
    }
}